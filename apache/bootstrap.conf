# caspratique.conduigo.com — bootstrap vhost (pre-first-certificate).
# Template: deploy.sh renders __DOMAIN__ → ${DOMAIN} into apache/active.conf.
# HTTP only, so `apachectl -t` passes with no certs on disk yet: the site is
# reachable over plain HTTP for the few seconds certbot needs to solve the
# HTTP-01 challenge through this very vhost.

<VirtualHost *:80>
    ServerName __DOMAIN__

    # ACME HTTP-01 challenge — served from the certbot webroot volume.
    # certbot writes <webroot>/.well-known/acme-challenge/<token> — the Alias
    # must mirror the full subpath (a bare /var/www/certbot/ target strips it).
    ProxyPass /.well-known/acme-challenge !
    Alias /.well-known/acme-challenge/ "/var/www/certbot/.well-known/acme-challenge/"
    <Directory "/var/www/certbot/.well-known/acme-challenge/">
        Require all granted
    </Directory>

    # Plain-HTTP passthrough so the app works before SSL exists.
    ProxyRequests Off
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "http"
    ProxyTimeout 300

    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^(.*)$ ws://frontend:3000/$1 [P,L]

    ProxyPass / http://frontend:3000/ retry=0
    ProxyPassReverse / http://frontend:3000/
</VirtualHost>

# caspratique.conduigo.com — steady-state vhosts (SSL active).
# Template: deploy.sh renders __DOMAIN__ → ${DOMAIN} into apache/active.conf.
# Requires the certbot volume to hold /etc/letsencrypt/live/${DOMAIN}/… .

# ---------------------------------------------------------------------------
# :80 — ACME HTTP-01 exception first, everything else redirected to HTTPS.
# ---------------------------------------------------------------------------
<VirtualHost *:80>
    ServerName __DOMAIN__

    # certbot renewals are answered from the shared webroot volume — this
    # MUST win over the catch-all redirect below.
    # certbot writes <webroot>/.well-known/acme-challenge/<token> — the Alias
    # must mirror the full subpath (a bare /var/www/certbot/ target strips it).
    ProxyPass /.well-known/acme-challenge !
    Alias /.well-known/acme-challenge/ "/var/www/certbot/.well-known/acme-challenge/"
    <Directory "/var/www/certbot/.well-known/acme-challenge/">
        Require all granted
    </Directory>

    # Redirect everything EXCEPT the ACME challenge (Redirect would otherwise
    # win over the Alias above and break renewals — verified the hard way).
    RedirectMatch 301 "^/(?!\.well-known/acme-challenge/)(.*)$" "https://__DOMAIN__/$1"
</VirtualHost>

# ---------------------------------------------------------------------------
# :443 — TLS termination + reverse proxy to the Next.js standalone server.
# ---------------------------------------------------------------------------
<VirtualHost *:443>
    ServerName __DOMAIN__
    Protocols h2 http/1.1

    SSLEngine on
    SSLCertificateFile "/etc/letsencrypt/live/__DOMAIN__/fullchain.pem"
    SSLCertificateKeyFile "/etc/letsencrypt/live/__DOMAIN__/privkey.pem"
    SSLProtocol -all +TLSv1.2 +TLSv1.3

    # Minimal security headers.
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Strict-Transport-Security "max-age=31536000"

    # Proxy to the frontend service (Docker DNS) — never localhost.
    ProxyRequests Off
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    ProxyTimeout 300

    # WebSocket upgrades tunnel straight to the backend…
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^(.*)$ ws://frontend:3000/$1 [P,L]
    # …everything else goes over plain HTTP proxying.
    ProxyPass / http://frontend:3000/ retry=0
    ProxyPassReverse / http://frontend:3000/
</VirtualHost>

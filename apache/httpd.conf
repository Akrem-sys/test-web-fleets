# Base httpd config for the caspratique reverse proxy (httpd:2.4-alpine).
# Mounted at /usr/local/apache2/conf/httpd.conf (read-only) by docker-compose.
# The active vhost file (rendered by deploy/deploy.sh) is included at the bottom:
#   apache/bootstrap.conf    — HTTP-only, used until the first certificate exists
#   apache/caspratique.conf  — ACME exception + redirect on :80, SSL on :443

ServerRoot "/usr/local/apache2"

# 80 serves ACME + (redirect|proxy); 443 serves SSL once the cert is issued.
Listen 80
Listen 443

LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule env_module modules/mod_env.so
LoadModule setenvif_module modules/mod_setenvif.so
LoadModule mime_module modules/mod_mime.so
LoadModule dir_module modules/mod_dir.so
LoadModule headers_module modules/mod_headers.so
LoadModule alias_module modules/mod_alias.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so
LoadModule proxy_wstunnel_module modules/mod_proxy_wstunnel.so
LoadModule socache_shmcb_module modules/mod_socache_shmcb.so
LoadModule ssl_module modules/mod_ssl.so
LoadModule http2_module modules/mod_http2.so

User daemon
Group daemon
ServerName localhost
ServerAdmin webmaster@conduigo.com

# Lock the filesystem down; only the ACME webroot is ever served from disk.
<Directory />
    AllowOverride none
    Require all denied
</Directory>

DocumentRoot "/usr/local/apache2/htdocs"
<Directory "/usr/local/apache2/htdocs">
    Require all granted
</Directory>

<Files ".ht*">
    Require all denied
</Files>

# Log to the container's stdout/stderr (docker logs / compose logs).
ErrorLog /proc/self/fd/2
LogLevel warn
LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" combined
CustomLog /proc/self/fd/1 combined

TypesConfig conf/mime.types
DirectoryIndex index.html

# The vhost actually served — swapped by deploy/deploy.sh, never edited here.
IncludeOptional conf/sites/active.conf

name: caspratique

# Production stack for caspratique.conduigo.com
# - db + frontend live on the internal `internal` network only (nothing is
#   published to the host except apache 80/443).
# - The `migrate` one-shot applies the committed Prisma 8 migration graph.
# - `certbot` is ran ad hoc: `docker compose run --rm certbot` (issuance) /
#   `docker compose run --rm certbot renew` (renewal, host crontab).
# Variables are interpolated from the .env generated by deploy/deploy.sh.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fleets
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: fleets
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleets -d fleets"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s
    networks:
      - internal

  # Debug access to db only (loopback, never public):
  #   docker compose --profile debug up -d db-debug
  db-debug:
    image: alpine/socat
    profiles:
      - debug
    restart: unless-stopped
    command: TCP-LISTEN:5432,fork,reuseaddr TCP:db:5432
    ports:
      - "127.0.0.1:${DB_DEBUG_PORT:-5433}:5432"
    depends_on:
      - db
    networks:
      - internal

  migrate:
    # Same bun image/graph as the build's deps stage (Dockerfile target).
    # `prisma db migrate` applies the committed on-disk migration graph
    # (migrations/app/**) and advances the marker; on a fresh database it
    # starts from "empty". No `contract emit` needed — src/prisma/contract.{json,d.ts}
    # are committed artifacts.
    build:
      context: .
      target: migrate
    environment:
      DATABASE_URL: postgresql://fleets:${POSTGRES_PASSWORD:?}@db:5432/fleets
    command: sh -c 'bunx prisma db migrate --db "$$DATABASE_URL"'
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks:
      - internal

  frontend:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # NEVER localhost — the app talks to the `db` service over the internal network.
      DATABASE_URL: postgresql://fleets:${POSTGRES_PASSWORD:?}@db:5432/fleets
    expose:
      - "3000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - internal

  apache:
    image: httpd:2.4-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./apache/httpd.conf:/usr/local/apache2/conf/httpd.conf:ro
      - ./apache:/usr/local/apache2/conf/sites:ro
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    depends_on:
      - frontend
    networks:
      - internal

  certbot:
    # One-shot, never a daemon: `restart: no` + gated behind the `tls` profile
    # so plain `docker compose up -d` never launches it.
    image: certbot/certbot
    profiles:
      - tls
    restart: "no"
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - certbot-www:/var/www/certbot
    command: >-
      certonly --webroot -w /var/www/certbot
      -d ${DOMAIN:?DOMAIN must be set in .env}
      --email ${CERTBOT_EMAIL:?CERTBOT_EMAIL must be set in .env}
      --agree-tos --no-eff-email --non-interactive

networks:
  internal:

volumes:
  pgdata:
  certbot-etc:
  certbot-var:
  certbot-www:
